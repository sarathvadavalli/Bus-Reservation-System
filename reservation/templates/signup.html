{% extends 'base.html' %} 
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'password_style.css' %}">
<style>
    body{
        background-color:slategrey;
    }
</style>
<script src="{% static 'password_field.js' %}" defer></script>

<div class="container my-5">
    <div class="row justify-content-center" style="margin: 5px -70px; width: 120%;">
        <div class="col-lg-5 col-md-7 col-sm-10 col-xs-12">
            <div class="card rounded-0">
                <div class="card-header">
                    <div class="card-title text-center h3 b-0">Registration</div>
                </div>
                <div class="card-body">
                    <div class="contaier-fluid">
                        <form action="{% url 'signup' %}" method="post" id="registration-form">
                            {% csrf_token %}
                            <!-- <div class="mb-3">
                                <label for="name" class="control-label">Name:</label>
                                <input name='name' id="name" class="form-control" type="text" required>
                            </div> -->
                            <div class="mb-3">
                                <label for="email" class="control-label">Email:</label>
                                <input name='email' class="form-control" type="text" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="control-label">Username:</label>
                                <input name='username' id="username" class="form-control" type="text" required>
                            </div>
                            <div class="mb-3">
                                <label for="first_name" class="control-label">First Name:</label>
                                <input name='first_name' id="first_name" class="form-control" type="text" required>
                            </div>
                            <div class="mb-3">
                                <label for="last_name" class="control-label">Last Name:</label>
                                <input name='last_name' id="last_name" class="form-control" type="text" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="control-label">Password:</label> <br>
                                <div class="password-container">
                                    <input type="password" id="password" name="password" class="form-control" required>
                                    <img src = "{% static 'eye-open.png' %}" class="toggle-password" 
                                      data-eye-open="{% static 'eye-open.png' %}" 
                                      data-eye-close="{% static 'eye-close.png' %}" 
                                      onclick="togglePassword('password', this)">
                                </div>
                            </div>
                            <div class="mb-1">
                                <label for="phno" class="control-label">Mobile no:</label>
                                <input name='phno' id="phno" class="form-control">
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-danger text-center mb-2">{{error}}</p>
                <div class="card-footer text-center">
                    <button class="btn btn-sm btn-primary rounded-0 w-100" form="registration-form">Create Account</button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script>   
        phone_no = document.getElementById("phno");
        phone_no.oninput = () => {
            if (!isValidPhoneNumber(phone_no.value)) {
                phone_no.setCustomValidity("Please enter a valid 10-digit phone number");
            } else {
                phone_no.setCustomValidity("");
            }
        };

        function isValidPhoneNumber(phone) {
            if (!(!phone.includes("  ") && !phone.includes("--") && !phone.includes(" -") && !phone.includes("- "))) {
                return false;
            }

            // Remove spaces and hyphens
            phone = phone.replace(/[\s-]/g, '');
            // Check if phone number is exactly 10 digits
            const regex = /^(\+\d{1,3})?\d{10}$/;
            return regex.test(phone);
        }
    </script>

{% endblock %}
